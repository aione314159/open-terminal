<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Open Terminal — a real terminal panel inside Obsidian</title>
  <desc id="desc">Dark terminal-themed banner with a three-line headline and cyan signal-stream waves.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#070d18"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>

  <!-- Product mark -->
  <g fill="none" stroke="#22d3ee" stroke-width="2">
    <rect x="72" y="58" width="32" height="24"/>
    <path d="M79 66l5 4-5 4M89 74h8"/>
  </g>
  <text x="120" y="77" fill="#f5fbff" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="20" font-weight="700">Open Terminal</text>

  <rect x="72" y="132" width="3" height="350" fill="#22d3ee" opacity=".55"/>

  <!-- Message -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-weight="700" letter-spacing="-1.5">
    <text x="112" y="218" fill="#f5fbff" font-size="55">A real terminal.</text>
    <text x="112" y="287" fill="#f5fbff" font-size="55">Below your editor.</text>
    <text x="112" y="356" fill="#22d3ee" font-size="55">Where the notes are.</text>
  </g>
  <text x="115" y="398" fill="#94a3b8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14">Obsidian plugin · real TTY via node-pty · tabs · desktop only</text>

  <!-- Feature labels -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14" font-weight="700">
    <text x="115" y="440" fill="#fcd34d">Tabs</text>
    <text x="177" y="440" fill="#5eead4">Real TTY</text>
    <text x="276" y="440" fill="#c4b5fd">cd to note</text>
    <text x="400" y="440" fill="#fda4af">Light &amp; Dark</text>
  </g>

